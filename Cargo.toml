[package]
name = "splice-compositor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Smithay-based Wayland compositor for Splice"

[patch.crates-io]
# smithay 0.7.0 plus a few small patches; see vendor/README.md.
smithay = { path = "vendor/smithay" }

[workspace]
members = [".", "crates/*"]
exclude = ["vendor/smithay"]

[dependencies]
splice-layout = { path = "crates/splice-layout" }
splice-theme = { path = "crates/splice-theme" }
splice-config = { path = "crates/splice-config" }
png = "0.17"
# Already built for splice-theme; decodes the wallpaper.
image = "0.25"
libc = "0.2"
splice-ipc = { path = "crates/splice-ipc" }
# The built-in shell's pictures (bar, power menu, notices).
splice-ui = { path = "crates/splice-ui" }
# What the shell services process says and is told.
splice-shell-protocol = { path = "crates/splice-shell-protocol" }
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_egl",
    "backend_drm",
    "backend_gbm",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
    # The cursor plane on rotated or scaled outputs (else the cursor is composited there on every move).
    "renderer_pixman",
    "xwayland",
    "desktop",
    "wayland_frontend",
] }
calloop = "0.14"
smithay-drm-extras = { version = "0.1", default-features = false }
xcursor = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
drm-ffi = "0.9"
