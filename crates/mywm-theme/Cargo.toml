[package]
name = "mywm-theme"
version = "0.1.0"
edition = "2024"
description = "Wallpaper helpers and Material-You theme generation for MyWM (kitty, GTK, nvim, Vesktop, greeter)"

[dependencies]
mywm-config = { path = "../mywm-config" }
material-colors = { version = "0.4.2", features = ["image", "serde"] }
minijinja = "2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
