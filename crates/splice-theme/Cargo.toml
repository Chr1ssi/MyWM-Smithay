[package]
name = "splice-theme"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Wallpaper helpers and wallpaper-derived theme generation for Splice (kitty, foot, GTK, nvim, Vesktop, greeter)"

[dependencies]
splice-config = { path = "../splice-config" }
libc = "0.2"
material-colors = { version = "0.4.2", features = ["image", "serde"] }
minijinja = "2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
