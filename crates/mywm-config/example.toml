# Beispielkonfiguration für mywm (nur zur Orientierung).
#
# Alle Einstellungen sind auskommentiert; es gelten die eingebauten Standardwerte.
# Zum Anpassen die Datei nach $XDG_CONFIG_HOME/mywm/config.toml kopieren und die
# gewünschten Zeilen aktivieren (führendes "#" entfernen). Auskommentierte
# Einstellungen stehen ohne Leerzeichen nach dem "#", erklärende Kommentare mit.
# Auf NixOS wird die echte Konfiguration über Home Manager erzeugt.

# Jeder Monitor hat einen festen Workspace, nummeriert in der Reihenfolge dieser
# Liste (der erste Monitor bekommt 1, der zweite 2, ...). Nicht aufgeführte Monitore
# folgen danach. Zusätzliche Workspaces (bis Nummer 9) entstehen dynamisch auf dem
# aktuellen Monitor und verschwinden wieder, sobald sie leer sind und man sie verlässt.
# Änderungen gelten nach Neustart.
#workspace_outputs = ["DP-3", "HDMI-A-1", "DP-1"]
# Outputs not listed here use tear-free VSync presentation. Im Smithay-Compositor kippen
# Frames auf gelisteten Monitoren sofort (Tearing), aber nur solange ein erkanntes Spiel
# (game_app_id_prefixes) dort im Vollbild fokussiert ist und Tearing über
# wp_tearing_control_v1 erlaubt.
#async_outputs = ["DP-3"]
# Fenster mit Elternfenster (z. B. Dateidialoge) standardmäßig frei schwebend.
#float_dialogs = true
# Der Gaming-Workspace entsteht auf diesem Monitor, sobald ein Spiel startet, und
# verschwindet mit dem letzten Spielfenster wieder (Standard: Monitor mit Workspace 1).
# Er ist ausschließlich für Spiele reserviert: andere Fenster können weder dort
# starten noch dorthin verschoben werden. Ohne Präfixe gibt es keinen Gaming-Workspace.
#gaming_output = "DP-3"
#game_app_id_prefixes = ["steam_app_", "gamescope"]
# Programm und Argumente getrennt, ohne Shell-Auswertung.
#terminal = ["kitty"]
# Standard: $HOME/Bilder/Wallpaper. Muss ein absoluter Pfad sein.
#screenshot_directory = "/home/nutzer/Bilder/Screenshots"
#wallpaper_directory = "/home/nutzer/Bilder/Wallpaper"

# Optional: adaptive sync remains off except while a recognized game is visibly
# fullscreen on this output. Der Smithay-Compositor schaltet VRR selbst (DRM); command
# wird dort nicht mehr benutzt (nur das River-MyWM ruft damit wlr-randr auf).
#[vrr]
#enabled = false
#output = "DP-3"
#command = ["wlr-randr"]

# Maus und Tastatur. Nicht gesetzte Werte lassen die Einstellung des Geräts unverändert.
#[input]
#accel_profile = "flat"    # "flat" (roh, ideal für Spiele) oder "adaptive"
#accel_speed = 0.0         # -1.0 bis 1.0
#natural_scroll = false
#tap = true                # Tippen zum Klicken (Touchpad)
#left_handed = false
#repeat_rate = 25          # Wiederholungen pro Sekunde
#repeat_delay = 200        # Millisekunden bis zur ersten Wiederholung

# Effekte (nie bei Vollbildfenstern, also nicht in Spielen).
#[effects]
#corner_radius = 12        # abgerundete Fenster und Rahmen, logische Pixel
#inactive_opacity = 0.95   # Fenster ohne Fokus leicht durchsichtig
#animation_ms = 160        # Fenster gleiten an ihren Platz und blenden ein (0 = aus)
#shadow = 24               # weicher Schatten, Ausdehnung in logischen Pixeln
#blur = 6                  # unscharfes Wallpaper hinter durchsichtigen Fenstern (1-16, 0 = aus)
# Transparenz pro Programm: in einer Regel, z. B.
# [[rules]]
# app_id = "kitty"
# opacity = 0.92

# Nur Smithay-Compositor (Hardware): Frames so spaet wie moeglich vor dem Vblank
# rendern, damit sie den neuesten Client-Inhalt zeigen (weniger Latenz). Bei VRR
# oder Tearing inaktiv. margin_ms ist die Reserve zusaetzlich zur gemessenen Renderzeit.
#[render]
#late_scheduling = false
#margin_ms = 2.0
# Auf async_outputs auch tearen, wenn das Spiel es nicht per wp_tearing_control erlaubt.
#force_tearing = false

# Sekunden; 0 deaktiviert den jeweiligen Inaktivitäts-Timer.
#[idle]
#lock_after_seconds = 300
#monitor_off_after_seconds = 600

#[keyboard]
#layout = "de"
#variant = ""
#options = ""

#[appearance]
#gaps_inner = 4
#gaps_outer = 4
#border_width = 2
#active_border = "#89b4fa"
#inactive_border = "#45475a"
#urgent_border = "#f38ba8"   # Fenster, das Aufmerksamkeit will (xdg-activation)
# Gemeinsame Palette für WM und Quickshell.
#background = "#1e1e2e"
#surface = "#313244"
#text = "#cdd6f4"
#muted_text = "#a6adc8"

#[bindings]
#reload = ["Super+Shift+r"]
#wallpaper = ["Super+Shift+w"]
# Screenshot: Bereich ziehen oder Fenster anklicken (Enter = ganzer Monitor, Esc = abbrechen).
# Speichert ein PNG in screenshot_directory und kopiert es in die Zwischenablage (wl-copy).
#screenshot = ["Super+s"]
#screenshot_screen = ["Super+Shift+s"]   # Monitor unter dem Mauszeiger
#screenshot_window = ["Super+Ctrl+s"]    # fokussiertes Fenster
# Übersicht: alle Workspaces des Monitors als Vorschau; Klick oder Pfeiltasten + Enter wählen, Esc schließt.
#overview = ["Super+Tab"]
# Spiele und VMs dürfen Tastenkürzel abfangen (keyboard-shortcuts-inhibit). Mit dieser Taste holt man sich die Tastatur zurück.
#release_shortcuts = ["Super+Shift+Escape"]
#lock = ["Super+Escape"]
#terminal = ["Super+Return"]
#launcher = ["Super+Space"]
#close = ["Super+q"]
#exit = ["Super+m"]
#toggle_floating = ["Super+v"]
# Neu im Smithay-Compositor: Vollbild umschalten, Spaltenbreite ändern.
#toggle_fullscreen = ["Super+f"]
#column_shrink = ["Super+minus"]
#column_grow = ["Super+equal"]
# Globaler Floating-Stack: ein-/ausblenden bzw. Fenster hinein-/herausverschieben.
#toggle_scratchpad = ["Super+grave"]
#move_to_scratchpad = ["Super+Shift+grave"]
# Monitorfokus bzw. fokussiertes Fenster geometrisch zum Nachbarmonitor bewegen.
#focus_output_left = ["Super+Alt+Left"]
#focus_output_right = ["Super+Alt+Right"]
#focus_output_up = ["Super+Alt+Up"]
#focus_output_down = ["Super+Alt+Down"]
#move_to_output_left = ["Super+Shift+Left"]
#move_to_output_right = ["Super+Shift+Right"]
#move_to_output_up = ["Super+Shift+Up"]
#move_to_output_down = ["Super+Shift+Down"]
# Mit linker Maustaste Floating-Fenster verschieben; mit rechter Floating-Fenster
# oder gekachelte Spalten skalieren.
#pointer_modifiers = "Super"
#focus_left = ["Super+h", "Super+Left"]
#focus_right = ["Super+l", "Super+Right"]
#move_left = ["Super+Shift+h"]
#move_right = ["Super+Shift+l"]
# Workspace auf dem aktuellen Monitor wechseln (zyklisch, inklusive dynamischer).
#workspace_previous = ["Super+Ctrl+Left", "Super+Ctrl+Up"]
#workspace_next = ["Super+Ctrl+Right", "Super+Ctrl+Down"]
# Fenster in den vorigen/nächsten Workspace des Monitors verschieben.
#move_to_workspace_previous = ["Super+Ctrl+Shift+Up"]
#move_to_workspace_next = ["Super+Ctrl+Shift+Down"]
# Neuen Workspace auf dem aktuellen Monitor anlegen und wechseln bzw. das
# fokussierte Fenster in einen neuen Workspace verschieben.
#new_workspace = ["Super+n"]
#move_to_new_workspace = ["Super+Shift+n"]
# Zusammen mit den Ziffern 1 bis 9 (Nummern bestehender Workspaces).
#workspace_modifiers = "Super"
#move_to_workspace_modifiers = "Super+Shift"

# Frei benannte Kürzel zum Starten beliebiger Programme.
#[program_bindings.browser]
#keys = ["Super+b"]
#command = ["helium-browser"]

#[program_bindings.file_manager]
#keys = ["Super+e"]
#command = ["thunar"]

# Regeln gelten beim ersten Einordnen eines Fensters, nicht bei späteren Änderungen.
# App-IDs werden beim Start einer Anwendung im mywm-Log ausgegeben.
# Alle angegebenen Selektoren müssen exakt passen; letzte Angabe je Eigenschaft gewinnt.
#
#[[rules]]
#app_id = "firefox"
#workspace = 2  # Nummer wie in der Bar; wirkt nur, solange dieser Workspace existiert
#
#[[rules]]
#app_id = "org.gnome.Calculator"
#floating = true
#
#[[rules]]
#dialog = true
#floating = true

# Neu im Smithay-Compositor (ersetzt kanshi): Monitore einrichten. Position in
# logischen Pixeln (links oben); ohne Angabe folgt der Monitor rechts vom vorigen.
# transform: normal, 90, 180, 270, flipped, flipped-90, flipped-180, flipped-270.
#[[outputs]]
#name = "HDMI-A-1"
#mode = "2560x1080@60"
#position = [0, 0]
#
#[[outputs]]
#name = "DP-3"
#mode = "2560x1440@143.97"
#position = [0, 1080]
#
#[[outputs]]
#name = "DP-1"
#mode = "2560x1440@59.95"
#position = [2560, 0]
#transform = "270"
