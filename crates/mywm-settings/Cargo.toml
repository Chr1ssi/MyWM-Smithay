[package]
name = "mywm-settings"
version = "0.1.0"
edition = "2024"
description = "Graphical settings and keybinding editor for the MyWM compositor"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mywm-settings"
path = "src/main.rs"

[dependencies]
mywm-config = { path = "../mywm-config" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
toml_edit = "0.25"
png = "0.17"
